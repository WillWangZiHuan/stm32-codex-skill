name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependency
        run: python -m pip install -r stm32-cubemx-build/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate capability packs
        run: python stm32-cubemx-build/scripts/validate_packs.py

      - name: Compile-check helper scripts
        run: python -m compileall -q stm32-cubemx-build/scripts

      - name: Parse Windows smoke harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path "stm32-cubemx-build/scripts/windows_smoke.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
